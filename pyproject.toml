[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app_ddl_creation"
version = "0.2.9"
description = "Databricks DDL execution framework"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Shivam" }
]

dependencies = [
    "pyspark>=3.3.0"
]
[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-mock",
]

[project.scripts]
ddl-runner = "app_ddl_creation.main.driver:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app_ddl_creation*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
app_ddl_creation = [
    "env_config/**/*.json",
    "Layer/**/*.sql"
]
